# =============================================================================
# Пример TOML-конфигурации certbot-dns: ACME + DNS-провайдеры + sync зон.
# Скопируйте в /etc/certbot-dns/config.toml или укажите: certbot-dns -config /path/to/config.toml
# =============================================================================
#
# Провайдеры задаются именованными блоками [[providers]]. Имя (name) ссылается
# в [[certificates]].provider и в [sync] (master / slaves).
#
# Зона для DNS-01 выводится автоматически: последние две метки apex
# (host.example.com → example.com).
#
# Обратная совместимость: секция [fastdns] без [[providers]] автоматически
# создаёт провайдер name = "default", type = "fastdns". В [[certificates]]
# можно не указывать provider — тогда используется "default".
#
# =============================================================================

# -----------------------------------------------------------------------------
# [acme] — учётная запись и каталог Let's Encrypt
# -----------------------------------------------------------------------------

[acme]
# Контактный email для регистрации ACME (Let's Encrypt может слать уведомления).
email = "admin@example.com"
# Каталог ЦС: "production" — боевой LE; "staging" — тестовый LE (не доверяют браузеры).
directory = "production"
# Каталог для account.key (EC P-256 ключ ACME-аккаунта) и registration.json.
state_dir = ".acme-state"
# Необязательно. Строка User-Agent в запросах к ACME; если пусто — встроенное значение.
# user_agent = "certbot-dns/1"

# -----------------------------------------------------------------------------
# [[providers]] — именованные DNS-провайдеры (один блок = один экземпляр API)
# -----------------------------------------------------------------------------

# --- FastVPS FastDNS ---
[[providers]]
name = "fv-main"
type = "fastdns"
# Токен авторизации FastDNS. Рекомендуется ${FASTDNS_API_TOKEN} из окружения.
api_token = "${FASTDNS_API_TOKEN}"
# Необязательно. Базовый URL API; если пусто — fastdns.fv.ee.
# api_url = ""
# DNS-01 для FastDNS выполняется последовательно (одна TXT за раз): у API часто нельзя
# два параллельных AppendRecords на одно имя (_acme-challenge при *.domain + domain).
# Перед каждым Present удаляются старые TXT с тем же именем (остатки сорванных выпусков).

# --- Alibaba Cloud DNS (AliDNS) ---
# [[providers]]
# name = "ali-dns"
# type = "alibabacloud"
# access_key_id = "${ALIBABA_ACCESS_KEY_ID}"
# access_key_secret = "${ALIBABA_ACCESS_KEY_SECRET}"
# region_id = "${ALIBABA_REGION_ID}"

# -----------------------------------------------------------------------------
# [fastdns] — устаревший формат (обратная совместимость)
# -----------------------------------------------------------------------------
# Если задан только [fastdns] без [[providers]], приложение создаёт провайдер
# name = "default", type = "fastdns" с этими полями. Новые установки используйте [[providers]].
#
# [fastdns]
# api_token = "${FASTDNS_API_TOKEN}"
# api_url = ""

# -----------------------------------------------------------------------------
# [dns_challenge] — ожидание распространения TXT перед проверкой у ЦС
# -----------------------------------------------------------------------------

[dns_challenge]
# Максимальное суммарное время ожидания появления TXT (синтаксис Go: 24h, 90m).
propagation_timeout = "24h"
# Пауза между опросами DNS (и первая пауза перед первой проверкой внутри lego).
propagation_interval = "10m"
# Рекурсивные резолверы "host:port" для pre-check TXT до запроса к Let's Encrypt.
# Если не задано — 8.8.8.8 и 1.1.1.1 (надёжнее, чем только 127.0.0.53 systemd-resolved).
# recursive_resolvers = ["8.8.8.8:53", "1.1.1.1:53"]

# -----------------------------------------------------------------------------
# [[certificates]] — один блок: список domains → несколько выпусков и подпапок
# -----------------------------------------------------------------------------

[[certificates]]
# Произвольная метка для логов (если пусто — #0, #1, … по порядку блоков).
id = "sites"
# Имя провайдера из [[providers]] — куда писать TXT для DNS-01 всего блока (строка или массив).
provider = ["fv-main"]
# Список доменов: wildcard *.a.b даёт SAN *.a.b + a.b; только c.d — отдельный apex;
# несколько *. — несколько wc-* каталогов под output_dir.
domains = ["*.example.com"]
# Базовый каталог: внутри wc-* / apex-* — YYYY-MM-DD (fullchain, privkey, issuer), symlink live.
# При прерывании выпуска может появиться .obtain-checkpoint.json — продолжение того же заказа ACME.
output_dir = "./out/sites"
# Алгоритм ключа: ec256 | ec384 | rsa2048 | rsa3072 | rsa4096 | rsa8192.
key_type = "ec256"
# За сколько дней до NotAfter перевыпускать (или если нет fullchain).
renew_before_days = 25

# -----------------------------------------------------------------------------
# [sync] — полное зеркало DNS-записей: master → slaves
# -----------------------------------------------------------------------------
#
# Master — источник правды. Каждый slave приводится к тому же набору записей
# (создание, обновление, удаление лишнего). По умолчанию не синхронизируются
# имена _acme-challenge.* — TXT для ACME остаются только на провайдере из
# [[certificates]].provider.
#
# enabled = false — только ACME, без sync.
# enabled = true  — в daemon: цикл sync каждые sync.interval; в once: один проход после ACME.

[sync]
enabled = false
# Пауза между циклами sync в режиме daemon.
interval = "onstart"
# Типы записей для зеркалирования; по умолчанию все поддерживаемые типы.
# record_types = ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "SRV"]
# Исключения по имени (glob); по умолчанию ["_acme-challenge.*"].
# exclude_names = ["_acme-challenge.*"]

# [[sync.zones]]
# zone = "example.com"
# master = "fv-main"
# slaves = ["ali-dns"]
#
# [[sync.zones]]
# zone = "example.com"
# master = "file:///etc/certbot-dns/example.com.zone"
# slaves = ["ali-dns"]

# -----------------------------------------------------------------------------
# [runtime] — режим процесса и логирование
# -----------------------------------------------------------------------------

[runtime]
# "once" — один проход (проверка сроков, выпуск, sync при enabled) и выход.
# "daemon" — бесконечный цикл: ACME + sync, сон до следующей проверки.
mode = "once"
# В daemon: если все сертификаты свежие, не спать дольше этого без повторной проверки.
poll_when_ok = "24h"
# Уровень логов: debug | verbose | info | warning | error | fatal.
loglevel = "info"

# =============================================================================
# Ниже — закомментированные примеры (раскомментируйте по необходимости).
# =============================================================================

# --- Пример A: wildcard + apex, один провайдер ---
#
# [[certificates]]
# id = "a"
# provider = "fv-main"
# domains = ["*.example.com", "example.com"]
# output_dir = "./out/a"
# key_type = "ec256"
# renew_before_days = 25

# --- Пример B: только apex (каталог apex-*) ---
#
# [[certificates]]
# id = "b"
# provider = "fv-main"
# domains = ["example.com"]
# output_dir = "./out/b"
# key_type = "ec256"
# renew_before_days = 25

# --- Пример C: два блока [[certificates]] с разными провайдерами ---
#
# [[certificates]]
# id = "shop"
# provider = "fv-main"
# domains = ["*.shop.example.net", "cdn.shop.example.net"]
# output_dir = "./out/shop"
# key_type = "ec256"
# renew_before_days = 25
#
# [[certificates]]
# id = "backup"
# provider = "ali-dns"
# domains = ["*.backup.net"]
# output_dir = "./out/backup"
# key_type = "ec256"
# renew_before_days = 25

# --- Пример D: sync нескольких зон ---
#
# [sync]
# enabled = true
# interval = "onstart"
#
# [[sync.zones]]
# zone = "example.com"
# master = "fv-main"
# slaves = ["ali-dns"]
#
# [[sync.zones]]
# zone = "raidkon.com"
# master = "fv-main"
# slaves = ["ali-dns"]

